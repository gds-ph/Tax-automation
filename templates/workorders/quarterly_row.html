<tr data-eq-row>{% for field in row %}{% if field.name != 'DELETE' %}<td>{{ field }}{{ field.errors }}{% if field.name == 'base' %}</td><td><input aria-label="Catalog rate" data-rate readonly tabindex="-1">{% endif %}</td>{% endif %}{% endfor %}<td><span hidden>{{ row.DELETE }}</span><button type="button" data-remove class="button secondary" aria-label="Remove transaction">×</button>{{ row.non_field_errors }}</td></tr>
