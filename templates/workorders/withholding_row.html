<section class="transaction" data-transaction aria-labelledby="transaction-{{ row.prefix }}"><div class="transaction-heading"><h3 id="transaction-{{ row.prefix }}"><span data-row-title>Transaction</span></h3><span class="delete-checkbox">{{ row.DELETE }}</span><button type="button" class="remove-row" data-remove aria-label="Remove transaction">×</button></div>{{ row.non_field_errors }}<div class="transaction-grid" data-fields>{% for field in row %}{% if field.name != 'DELETE' %}<div class="field {% if field.errors %}has-error{% endif %}"><label for="{{ field.id_for_label }}">{% if field.name == 'tin' %}TIN{% elif field.name == 'atc' %}ATC{% elif field.name == 'base' %}Tax base (₱){% elif field.name == 'payee' %}Supplier / payee{% else %}{{ field.label }}{% endif %}</label>{{ field }}{% if field.errors %}<div class="field-errors" role="alert">{{ field.errors }}</div>{% endif %}</div>{% endif %}{% endfor %}</div><div class="removed-message" hidden>Transaction removed. <button type="button" class="button secondary small" data-undo>Undo</button></div></section>
