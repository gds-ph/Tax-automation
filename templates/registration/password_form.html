{% comment %}Shared so the credential form is identical whether it is the only
option or the fallback behind Feishu sign-in.{% endcomment %}
<form method="post" action="{% url 'login' %}" class="login-form">{% csrf_token %}
  {% if form.errors %}<div class="notice error" role="alert">Sign-in failed. Check your username and password.</div>{% endif %}
  <div class="field"><label for="id_username">Username</label><input class="input" type="text" name="username" id="id_username" autocomplete="username" value="{{ form.username.value|default_if_none:'' }}" required{% if autofocus %} autofocus{% endif %}></div>
  <div class="field"><label for="id_password">Password</label><input class="input" type="password" name="password" id="id_password" autocomplete="current-password" required></div>
  <input type="hidden" name="next" value="{{ next }}">
  <button class="button primary full-width" type="submit">Sign in <span aria-hidden="true">→</span></button>
</form>
